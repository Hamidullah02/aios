# Builds the aios release binaries and attaches them to a
# GitHub release.
#
# The point of this workflow is the install script. install.ps1
# downloads a named asset from a release; this workflow is what
# produces that asset. Without it the installer has nothing to
# install.
#
# aios ships for Windows, so this builds the one Windows asset
# the installer asks for: windows/amd64. Building assets for
# platforms that are not supported would mean publishing binaries
# that are not tested and not supported.
#
# The binaries are built with CGO_ENABLED=0 so they run on any
# machine of the same OS and CPU without a C toolchain. The
# audit log uses the pure-Go modernc.org/sqlite driver, so
# there is nothing to link against.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.42.0). Defaults to the current ref."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            goarch: amd64
            asset: aios_windows_amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test
        # The release must not ship a binary that fails its own
        # tests. The suite runs once, on the host, rather than
        # per target: it has no network dependency and the
        # targets differ only in the compiled binary.
        working-directory: aios-system
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Race detector
        # The shipped binaries are built with CGO_ENABLED=0, so
        # the race detector cannot run against them. It can run
        # against the same source with cgo enabled, and it has to
        # run here as well as in the CI workflow: a tag can be
        # pushed without a pull request ever having been opened,
        # and this is the last check before a binary reaches a
        # user.
        #
        # Two real data races were found this way in v0.47.0 --
        # in the egress proxy and in the approval handler -- both
        # in code the plain suite passed.
        working-directory: aios-system
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

      - name: Build
        working-directory: aios-system
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMIT: ${{ github.sha }}
        # The version is stamped in at link time. Without it every
        # binary would report "dev", and a user asking "which build
        # is this" would get an answer that cannot be acted on.
        #
        # The tag is the version, so the two cannot drift: the
        # release notes, the installer, and the binary all name
        # the same string. The commit is stamped too, because two
        # builds from the same tag can differ.
        #
        # $env:TAG, not $TAG.
        #
        # This runner is PowerShell, not bash. In bash, `$TAG`
        # expands from the environment. In PowerShell, `$TAG`
        # expands from a LOCAL VARIABLE named TAG, and the step's
        # `env:` block sets an ENVIRONMENT variable, which
        # PowerShell reaches as `$env:TAG`.
        #
        # So `$TAG` was empty, the linker was handed
        # `-X ...version.Version=` with nothing after it, and it
        # accepted that silently. The binary reported "aios" -- with
        # no version at all -- and the build passed.
        #
        # The check below caught it, which is what it is for.
        run: >
          go build -trimpath
          -ldflags="-s -w -X github.com/Hamidullah02/aios/aios-system/internal/version.Version=$env:TAG -X github.com/Hamidullah02/aios/aios-system/internal/version.Commit=$env:COMMIT"
          -o aios.exe ./cmd/aios

      - name: Check the binary reports the tag it was built from
        working-directory: aios-system
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # The stamp is checked, not assumed. A typo in the
        # -ldflags path builds fine and produces a binary that
        # says "dev" -- and the only way to notice is to run it.
        run: |
          $reported = ./aios.exe --version
          Write-Host "aios reports: $reported"
          if ($reported -notlike "*$env:TAG*") {
            Write-Error "binary does not report $env:TAG"
            exit 1
          }

      - name: Package (zip)
        working-directory: aios-system
        run: Compress-Archive -Path aios.exe -DestinationPath "${{ matrix.asset }}.zip"

      - name: Check the binary runs
        working-directory: aios-system
        run: ./aios.exe --help

      # The artifact has to be uploaded for the release job to have
      # anything to publish. Without this step the release job
      # downloaded an empty directory and had no assets.
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: aios-system/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    steps:
      # The full history is needed: this job pushes the module tag,
      # and a shallow clone has no parent commits to point it at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        shell: pwsh
        run: |
          @'
          The aios CLI.

          ## Install

          Windows (PowerShell):

          ```
          irm https://raw.githubusercontent.com/Hamidullah02/aios/main/install.ps1 | iex
          ```

          From source, if you already have Go:

          ```
          go install github.com/Hamidullah02/aios/aios-system/cmd/aios@latest
          ```

          ## Start

          Put your model key in a `.env` file in the directory you will
          run `aios` from:

          ```
          OPENROUTER_API_KEY=sk-or-...
          ```

          Then:

          ```
          aios web
          ```

          The UI opens in your browser. Type what you want done.
          '@ | Set-Content -Path notes.md -Encoding utf8

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          # The installer goes out with the release as well as living
          # in the repository. A user who lands on the release page
          # should not have to know that the script is in the source
          # tree; the tag's own copy is the one that matches the
          # binaries in this release.
          #
          # The assets are already in dist/ -- download-artifact
          # put them there. So the installer goes IN, not into a
          # subdirectory of it.
          Copy-Item install.ps1 dist/
          $assets = Get-ChildItem dist | ForEach-Object { $_.FullName }
          Write-Host "publishing: $($assets -join ', ')"
          gh release create $env:TAG @assets `
            --title "aios $env:TAG" `
            --notes-file notes.md `
            --clobber

      - name: Tag the module so `go install` can find it
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # The Go module lives in this repository's aios-system/
        # subdirectory, and the Go tooling only looks for a module
        # in a subdirectory under a tag whose name carries the
        # subdirectory: aios-system/v0.56.0, not v0.56.0.
        #
        # Without this tag the README's
        #
        #   go install github.com/Hamidullah02/aios/aios-system/cmd/aios@latest
        #
        # cannot work. It fails with "module ... found, but does
        # not contain package .../cmd/aios" -- the tooling found
        # the repository at the plain version tag and looked for
        # the package in the wrong place.
        #
        # This is not a guess. The rule was verified against the
        # Go module proxy's own metadata for a known subdirectory
        # module, and end to end with a local repository: with only
        # the prefixed tag the install succeeds, and with only the
        # plain tag it fails.
        #
        # The tag is created after the release is published, so a
        # failed release cannot leave a module version pointing at
        # binaries nobody can download.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "aios-system/$env:TAG" "$env:GITHUB_SHA"
          git push --force origin "refs/tags/aios-system/$env:TAG"
          echo "tagged aios-system/$env:TAG at $env:GITHUB_SHA"

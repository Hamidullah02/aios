id: probe-1
goal: write a marker file using the shell
tasks:
  - id: t1
    description: create marker.txt with the word shellran
    acceptance: marker.txt contains shellran
    tool: run_shell
    inputs:
      # The redirect operator has no space before it. Go quotes an
      # argv element that contains a space, so "echo shellran >
      # marker.txt" reaches cmd.exe as one quoted argument and cmd
      # prints the redirect literally instead of performing it.
      - command=cmd,/c,echo,shellran>marker.txt
